[workspace]
resolver = "3"
members = ["cli", "core", "ffi", "tools/uniffi-bindgen"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[profile.release]
# No panic = "abort": a panic stays in its thread (a socket loop) or becomes a UniFFI error, not an app crash.
lto = "thin"
codegen-units = 1
strip = "symbols"
