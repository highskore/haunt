[workspace]
resolver = "3"
members = ["core", "ffi", "cli"]
# Plugins build for wasm32-wasip2 on their own.
exclude = ["examples/hello"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
