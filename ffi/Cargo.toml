[package]
name = "haunt-ffi"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["staticlib", "lib"]
name = "haunt_ffi"

[features]
default = ["plugins"]
plugins = ["haunt-core/plugins"]

[dependencies]
haunt-core = { path = "../core", default-features = false, features = ["ffi"] }
uniffi.workspace = true
thiserror.workspace = true
